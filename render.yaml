services:
  - type: web
    name: chacha-dashboard
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REAL_ORDER
        value: "False"
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
